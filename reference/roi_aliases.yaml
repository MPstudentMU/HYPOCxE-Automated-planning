# ROI alias map
#
# Maps the many spellings a NON-TARGET structure (an OAR, or BODY) can carry
# in a RayStation clinical-goal export to one canonical name used throughout
# the engine. Keys are the canonical name; each value lists the literal
# spellings seen in exports that should map to it (matched case-insensitively
# after whitespace/underscore/hyphen normalization).
#
#   <canonical name>:
#     - <alias as it appears in exports>
#     - ...
#
# What this file does NOT do: canonicalize a target (PTV/ITV/CTV/GTV). Per
# docs/analysis_manual_th_v2.md §2.4's harmonisation table, a target
# collapses to just its base type regardless of dose suffix or export
# quirk ("PTV45"/"PTV 44"/"1 PTV45" -> "PTV", "ITV-T LR"/"zITV" -> "ITV"),
# except a nodal boost marker keeps its own bucket ("PTV-N55" -> "PTV-N")
# — a general rule handled in code (engine/parser.py:canonical_roi), not
# an exact-string table, since a patient is only ever on one dose regimen
# (the dose suffix is regimen-dependent noise, never a second coexisting
# target for the same patient).
#
# Source: docs/analysis_manual_th_v2.md §2.4's ROI harmonisation table,
# for every entry it lists. A few non-target entries below it doesn't
# mention (e.g. Sigmoid, Duodenum, Cauda Equina, Spinal Cord, BODY) are
# carried over unchanged, since real pilot exports show no spelling
# variants for them.

aliases:
  Bone Marrow:
    - Bone
    - zBone
    - Bone Marrow

  Kidney Lt:
    - Kidney_L
    - Kidney Lt
    - Kidney_Lt
    - Kidney Left

  Kidney Rt:
    - Kidney_R
    - Kidney Rt
    - Kidney_Rt
    - Kidney Right

  Femoral Head Lt:
    - Femur Head Lt
    - Femoral Head Lt
    - Femur_Head_L
    - Femoral Head_L

  Femoral Head Rt:
    - Femur Head Rt
    - Femoral Head Rt
    - Femur_Head_R
    - Femoral Head_R

  Rectum:
    - Rectum
    - Rectum_new
    - Rectum New

  Small Bowel:
    - Small Bowel
    - SmallBowel
    - Small_Bowel

  Bowel Bag:
    - Bowel
    - Bowel Bag
    - Bowel_Bag

  Sigmoid:
    - Sigmoid

  Duodenum:
    - Duodenum

  Cauda Equina:
    - Cauda Equina
    - Cauda_Equina
    - CaudaEquina

  Spinal Cord:
    - Spinal Cord
    - SpinalCord
    - Cord

  BODY:
    - BODY
    - Body
    - External
    - Skin
